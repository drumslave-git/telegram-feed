# Search in a feed (words, chips, the calendar, recent queries) and over every channel.
appId: dev.telegramfeed.telegram_feed
---
- runFlow: subflows/start.yaml
- runFlow:
    file: subflows/feed_from_folder.yaml
    env:
      FOLDER: News
- runFlow:
    file: subflows/open_feed.yaml
    env:
      FEED: News
- tapOn: 'Search'
- inputText: 'pier'
- pressKey: Enter
# The timeline goes to the newest match, with the bar under it.
- extendedWaitUntil:
    visible: '1 of 1'
    timeout: 15000
- assertVisible: '(?s).*about the pier.*'
- tapOn: 'Show as list'
- extendedWaitUntil:
    visible: '1 post found'
    timeout: 15000
- tapOn: 'Show as chat'
- assertVisible: '1 of 1'
# Words are offered again once they led to a post.
- tapOn: 'Clear'
- assertVisible: 'pier'
# Pictures and videos are a grid of tiles under their number.
- tapOn: 'Media'
- extendedWaitUntil:
    visible: '[0-9]+ posts found'
    timeout: 15000
- assertNotVisible: '(?s).*Test pattern from the harbour camera.*'
- tapOn: 'Links'
- extendedWaitUntil:
    visible: '(?s).*tide tables.*'
    timeout: 15000
- tapOn: 'Everything'
- tapOn: 'Jump to date'
- assertVisible: 'Calendar'
# A screen's slide swallows a tap made while it runs: each step waits for the screen it
# leads to.
- waitForAnimationToEnd
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Everything'
    timeout: 10000
- waitForAnimationToEnd
# The field has the focus again and the keyboard is up: it has a "Back" of its own, far
# below the one of the search bar.
- tapOn:
    text: 'Back'
    above: 'Everything'
- extendedWaitUntil:
    visible: 'Edit feed'
    timeout: 10000
- tapOn: 'Back'
- tapOn: 'Search posts'
- inputText: 'Northfield'
- pressKey: Enter
- extendedWaitUntil:
    visible: '(?s).*the library opens late on Thursdays.*'
    timeout: 15000
