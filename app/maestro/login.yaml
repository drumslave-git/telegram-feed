# The login screens, the QR alternative, and logging out again.
appId: dev.telegramfeed.telegram_feed
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Log in to Telegram'
    timeout: 90000
- tapOn: 'Log in with QR code instead'
- assertVisible: 'Log in with QR code'
- tapOn: 'Use a phone number instead'
- runFlow: subflows/login.yaml
- assertVisible: 'Search posts'
- assertVisible: 'Rules'
- assertVisible: 'Settings'
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: '(?s)Fixture Account\n.*'
    timeout: 10000
- tapOn: 'More'
- tapOn: 'Log out'
- assertVisible: 'Log out?'
- tapOn: 'Log out'
- extendedWaitUntil:
    visible: 'Log in to Telegram'
    timeout: 20000
