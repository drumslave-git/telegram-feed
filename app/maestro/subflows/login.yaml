# From the login screen to the home screen: the fake account takes any number and the
# code 12345.
appId: dev.telegramfeed.telegram_feed
---
- extendedWaitUntil:
    visible: 'Log in to Telegram'
    timeout: 10000
# A whole number typed with its plus: the screen puts the country code where it belongs.
- tapOn: 'Phone number'
- inputText: '+15550100'
- tapOn: 'Send code'
- extendedWaitUntil:
    visible: 'Is this the correct number\?'
    timeout: 10000
- tapOn: 'Yes'
- extendedWaitUntil:
    visible: 'Enter the code'
    timeout: 10000
# One box per digit, with the keyboard up; the code goes when its last digit is typed.
- inputText: '12345'
- extendedWaitUntil:
    visible: '(?s)Feeds.*Tab 1 of \d+'
    timeout: 30000
