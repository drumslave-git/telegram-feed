name: telegram_feed
description: Telegram client for reading channels as feeds, with keyword rules and read-aloud.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../packages/core
  telegram_gateway:
    path: ../packages/telegram_gateway
  app_db:
    path: ../packages/app_db
  rules:
    path: ../packages/rules
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  drift: ^2.35.0
  video_player: ^2.14.0
  just_audio: ^0.10.6
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  flutter_tts: ^4.2.5
  google_mlkit_language_id: ^0.15.1
  audio_session: ^0.2.4
  share_plus: ^13.3.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  google_sign_in: ^7.2.0
  visibility_detector: ^0.4.0+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
