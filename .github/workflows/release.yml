name: release
# Signed closed-beta APKs. Trigger: push a tag like v0.1.0 (or run manually).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Prebuilt TDLib for the pinned commit
        run: dart tool/fetch_tdlib.dart --repo ${{ github.repository }}
      - name: Signing key from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/upload.jks
          cat > app/android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APKs (arm64-v8a, x86_64)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --dart-define=TG_API_ID=${{ secrets.TG_API_ID }} \
            --dart-define=TG_API_HASH=${{ secrets.TG_API_HASH }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          ls -la build/app/outputs/flutter-apk/
      - name: Remove signing material
        if: always()
        run: rm -f app/android/upload.jks app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
