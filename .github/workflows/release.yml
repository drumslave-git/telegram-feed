name: release
# Signed release APKs for a version that debug-release.yml already tagged. Versions and
# tags are made automatically from the commits; this workflow is started by hand ("Run
# workflow", input: the tag, e.g. v0.3.0), builds that tag with the release key and adds the
# APKs to the same GitHub release, which then stops being a prerelease.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, e.g. v0.3.0
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Prebuilt TDLib for the pinned commit
        run: dart tool/fetch_tdlib.dart --repo ${{ github.repository }}
      - name: Signing key from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/upload.jks
          cat > app/android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APKs (arm64-v8a, x86_64)
        working-directory: app
        run: |
          tag='${{ inputs.tag }}'
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-name="${tag#v}" \
            --build-number=${{ github.run_number }} \
            --dart-define=TG_API_ID=${{ secrets.TG_API_ID }} \
            --dart-define=TG_API_HASH=${{ secrets.TG_API_HASH }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          ls -la build/app/outputs/flutter-apk/
      - name: Remove signing material
        if: always()
        run: rm -f app/android/upload.jks app/android/key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: false
          files: app/build/app/outputs/flutter-apk/*-release.apk
