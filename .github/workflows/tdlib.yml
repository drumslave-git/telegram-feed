name: tdlib
# Builds libtdjson.so (Android) from the pinned TDLib commit and publishes it as an asset of a
# GitHub release tagged `tdlib-<short sha>`. tool/fetch_tdlib.dart downloads it, locally and
# in release.yml and debug-release.yml (which starts again when this workflow finishes).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/tdlib_bindings/schema/TDLIB_COMMIT
      - tool/tdlib/**
      - .github/workflows/tdlib.yml

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          c=$(tr -d '[:space:]' < packages/tdlib_bindings/schema/TDLIB_COMMIT)
          echo "commit=$c" >> "$GITHUB_OUTPUT"
          echo "tag=tdlib-${c:0:7}" >> "$GITHUB_OUTPUT"

  android:
    needs: pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build libtdjson.so (arm64-v8a, x86_64)
        run: docker build --build-arg COMMIT_HASH=${{ needs.pin.outputs.commit }} --output out -f tool/tdlib/Dockerfile tool/tdlib
      - name: Repack as tar.gz (libs/<abi>/libtdjson.so)
        run: |
          mkdir -p pack && cd pack && unzip -q ../out/tdlib.zip && tar -czf ../libtdjson-android.tar.gz -C tdlib libs
          cd .. && tar -czf libtdjson-android-debug.tar.gz -C out tdlib-debug.zip
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: libtdjson-android*.tar.gz

  release:
    needs: [pin, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          echo "${{ needs.pin.outputs.commit }}" > TDLIB_COMMIT
          sha256sum libtdjson-android.tar.gz libtdjson-android-debug.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.pin.outputs.tag }}
          name: TDLib ${{ needs.pin.outputs.tag }}
          body: Prebuilt TDLib ${{ needs.pin.outputs.commit }} for Android (arm64-v8a, x86_64).
          files: |
            libtdjson-android.tar.gz
            libtdjson-android-debug.tar.gz
            SHA256SUMS
            TDLIB_COMMIT
