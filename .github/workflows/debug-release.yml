name: debug-release
# Versioned debug APKs, fully automatic. After `ci` passes on main (or after `tdlib` has
# published new binaries) this computes the next semantic version from the conventional
# commits since the last `vX.Y.Z` tag (packages/versioning): feat raises the minor, fix and
# perf the patch, a breaking change the major (the minor while 0.x). Commits of other types
# alone release nothing. It then tags the commit, builds debug APKs signed with the fixed
# debug key and publishes them as a prerelease with a changelog.
#
# Secrets: TG_API_ID, TG_API_HASH, DEBUG_KEYSTORE_BASE64 (a debug.keystore with the usual
# `android` passwords; a fixed key lets each APK install over the previous one and keeps the
# SHA-1 registered for Google sign-in valid). Optional: GOOGLE_SERVER_CLIENT_ID.
on:
  workflow_run:
    workflows: [ci, tdlib]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: debug-release
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Next version from the commits
        id: v
        run: |
          # Only the tip of main is released: an older commit would compute a version that
          # a newer run may already have taken.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "not the tip of main, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dart run versioning:next_version --notes notes.md --github-output "$GITHUB_OUTPUT"

      - name: Check the secrets
        if: steps.v.outputs.release == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          missing=""
          for name in TG_API_ID TG_API_HASH DEBUG_KEYSTORE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-java@v6
        if: steps.v.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Prebuilt TDLib for the pinned commit
        if: steps.v.outputs.release == 'true'
        run: |
          tag="tdlib-$(cut -c1-7 packages/tdlib_bindings/schema/TDLIB_COMMIT)"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            echo "::error::No $tag release yet. Run the tdlib workflow; this workflow starts again when it finishes."
            exit 1
          fi
          dart tool/fetch_tdlib.dart --repo ${{ github.repository }}

      - name: Fixed debug signing key
        if: steps.v.outputs.release == 'true'
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -i fingerprint

      - name: Build debug APKs (arm64-v8a, x86_64)
        if: steps.v.outputs.release == 'true'
        working-directory: app
        run: |
          flutter build apk --debug --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-name=${{ steps.v.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=TG_API_ID=${{ secrets.TG_API_ID }} \
            --dart-define=TG_API_HASH=${{ secrets.TG_API_HASH }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a x86_64; do
            mv "app-$abi-debug.apk" "telegram-feed-${{ steps.v.outputs.version }}-$abi-debug.apk"
          done
          ls -la

      - name: Remove the signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Release notes
        if: steps.v.outputs.release == 'true'
        run: |
          {
            echo "Debug build ${{ steps.v.outputs.version }} (build ${{ github.run_number }}) of $(git rev-parse --short HEAD)."
            echo "Install \`arm64-v8a\` on phones, \`x86_64\` on emulators. Each build installs over the previous one."
            echo
            cat notes.md
          } > body.md

      - uses: softprops/action-gh-release@v3
        if: steps.v.outputs.release == 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: ${{ steps.v.outputs.tag }} (debug)
          prerelease: true
          body_path: body.md
          files: app/build/app/outputs/flutter-apk/telegram-feed-*-debug.apk
