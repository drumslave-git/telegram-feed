name: debug-release
# Versioned APKs signed with the debug key, fully automatic. After `ci` passes on main (or
# after `tdlib` has published new binaries) this computes the next semantic version from the
# conventional commits since the last `vX.Y.Z` tag (packages/versioning): feat raises the
# minor, fix and perf the patch, a breaking change the major (the minor while 0.x). Commits
# of other types alone release nothing. It then tags the commit, builds APKs in release mode
# signed with the fixed debug key and publishes them as a prerelease with a changelog. Not
# debug mode: a debug build runs Dart unoptimised and scrolls several times slower.
#
# Secrets: TG_API_ID, TG_API_HASH, DEBUG_KEYSTORE_BASE64 (a debug.keystore with the usual
# `android` passwords; a fixed key lets each APK install over the previous one and keeps the
# SHA-1 registered for Google sign-in valid). Optional: GOOGLE_SERVER_CLIENT_ID.
on:
  workflow_run:
    workflows: [ci, tdlib]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: debug-release
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Next version from the commits
        id: v
        run: |
          # Only the tip of main is released: an older commit would compute a version that
          # a newer run may already have taken.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "not the tip of main, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dart run versioning:next_version --notes notes.md --github-output "$GITHUB_OUTPUT"

      - name: Check the secrets
        if: steps.v.outputs.release == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          missing=""
          for name in TG_API_ID TG_API_HASH DEBUG_KEYSTORE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-java@v6
        if: steps.v.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Prebuilt TDLib for the pinned commit
        if: steps.v.outputs.release == 'true'
        run: |
          tag="tdlib-$(cut -c1-7 packages/tdlib_bindings/schema/TDLIB_COMMIT)"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            echo "::error::No $tag release yet. Run the tdlib workflow; this workflow starts again when it finishes."
            exit 1
          fi
          dart tool/fetch_tdlib.dart --repo ${{ github.repository }}

      - name: Fixed debug signing key
        if: steps.v.outputs.release == 'true'
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          sha1=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -m1 'SHA1:' | sed 's/.*SHA1: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "fixed key SHA-1: $sha1"
          echo "DEBUG_KEY_SHA1=$sha1" >> "$GITHUB_ENV"

      - name: Build APKs (arm64-v8a, x86_64)
        if: steps.v.outputs.release == 'true'
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-name=${{ steps.v.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=TG_API_ID=${{ secrets.TG_API_ID }} \
            --dart-define=TG_API_HASH=${{ secrets.TG_API_HASH }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a x86_64; do
            mv "app-$abi-release.apk" "telegram-feed-${{ steps.v.outputs.version }}-$abi.apk"
          done
          ls -la

      - name: The APKs are signed with the fixed key
        if: steps.v.outputs.release == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/app/outputs/flutter-apk/telegram-feed-*.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-1' | sed 's/.*: //')
            echo "$apk: $got"
            if [ "$got" != "$DEBUG_KEY_SHA1" ]; then
              echo "::error::$apk is signed with $got, not with the fixed debug key $DEBUG_KEY_SHA1"
              exit 1
            fi
          done

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Release notes
        if: steps.v.outputs.release == 'true'
        run: |
          {
            echo "Build ${{ steps.v.outputs.version }} (build ${{ github.run_number }}) of $(git rev-parse --short HEAD), signed with the debug key."
            echo "Install \`arm64-v8a\` on phones, \`x86_64\` on emulators. Each build installs over the previous one."
            echo
            cat notes.md
          } > body.md

      - uses: softprops/action-gh-release@v3
        if: steps.v.outputs.release == 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: ${{ steps.v.outputs.tag }} (debug key)
          prerelease: true
          body_path: body.md
          files: app/build/app/outputs/flutter-apk/telegram-feed-*.apk
