name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos .
      - run: dart format --output=none --set-exit-if-changed app packages tool
      - name: dart test (packages)
        run: |
          for p in packages/*/; do (cd "$p" && dart test --reporter=compact); done
      - run: flutter test
        working-directory: app
