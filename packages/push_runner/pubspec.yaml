name: push_runner
description: "The native half of push: Firebase Cloud Messaging, the queue of pushes and the runs that handle them while the app is closed."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.telegramfeed.push_runner
        pluginClass: PushRunnerPlugin
